name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: validation/protobufjs/package-lock.json
      - run: make test vet build
      - run: test "$(bin/protocarry version)" = "ProtoCarry 0.1.3"
      - run: |
          make fixtures
          git diff --exit-code -- examples/demo validation/protobufjs/old.pb validation/protobufjs/new.pb validation/protobufjs/seed.bin validation/protobufjs/nested-seed.bin validation/kotlin-serialization/old.pb validation/kotlin-serialization/new.pb validation/kotlin-serialization/seed.bin
      - run: make demo validation
      - name: Assert recorded external outcomes still hold
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const recorded = JSON.parse(fs.readFileSync('validation/protobufjs/results.json'));
          const current = JSON.parse(fs.readFileSync('validation/protobufjs/runs/summary.json'));
          const v011 = JSON.parse(fs.readFileSync('validation/protobufjs/results-v0.1.1.json'));
          const outcomes = x => x.records.map(r => [r.runtime,r.version,r.option,r.shape,r.outcome]);
          if (JSON.stringify(outcomes(recorded)) !== JSON.stringify(outcomes(current))) throw new Error('external behavior changed; inspect evidence before updating the baseline');
          const empty = x => x.empty_records.map(r => [r.runtime,r.version,r.option,r.shape,r.empty_output,r.outcome]);
          if (JSON.stringify(empty(v011)) !== JSON.stringify(empty(current))) throw new Error('empty-message behavior changed');
          if (current.tool.tool !== '0.1.3' || current.legacy_replays.length !== 8) throw new Error('producer/legacy validation incomplete');
          JS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.runner }}
          path: |
            evidence/
            validation/protobufjs/runs/
          if-no-files-found: ignore
  kotlin:
    # One native runner is enough for this external library case; the Go and protobuf.js checks above cover both platforms.
    timeout-minutes: 20
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17.0.21'
          cache: gradle
          cache-dependency-path: |
            validation/kotlin-serialization/gradle/wrapper/gradle-wrapper.properties
            validation/kotlin-serialization/gradle/verification-metadata.xml
            validation/kotlin-serialization/*.gradle.kts
      - run: make kotlin-validation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-kotlin-serialization
          path: |
            validation/kotlin-serialization/runs/
            validation/kotlin-serialization/build/test-results/
          if-no-files-found: ignore
