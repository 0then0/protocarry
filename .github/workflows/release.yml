name: Release binaries
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  prepare:
    timeout-minutes: 20
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - run: make release
      - name: Verify native archive and release version
        run: |
          platform="$(go env GOOS)_$(go env GOARCH)"
          test "$(bin/release/$platform/protocarry version)" = "ProtoCarry 0.1.3"
          (cd bin && shasum -a 256 -c "protocarry_0.1.3_${platform}.tar.gz.sha256")
          mkdir extracted
          tar -xzf "bin/protocarry_0.1.3_${platform}.tar.gz" -C extracted
          test "$(extracted/protocarry version)" = "ProtoCarry 0.1.3"
      - name: Check tag matches binary version
        if: github.event_name == 'push'
        run: |
          test "$(bin/release/$(go env GOOS)_$(go env GOARCH)/protocarry version)" = "ProtoCarry ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: protocarry-${{ matrix.runner }}
          path: |
            bin/protocarry_*.tar.gz
            bin/protocarry_*.tar.gz.sha256
          if-no-files-found: error
  publish:
    timeout-minutes: 10
    if: github.event_name == 'push'
    needs: prepare
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Download and verify both native archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'protocarry-*' --dir artifacts
          test "$(ls -d artifacts/*/ | wc -l)" -eq 4
          for dir in artifacts/*/; do
            (cd "$dir" && sha256sum -c protocarry_*.tar.gz.sha256)
          done
          test "$(ls artifacts/*/*.tar.gz | wc -l)" -eq 4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*/* \
            --verify-tag --title "ProtoCarry $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
